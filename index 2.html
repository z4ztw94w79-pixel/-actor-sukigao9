const KEY='sukigaoActorsFinal1', IMGKEY='sukigaoActorsImages1', app=document.getElementById('app'), A=id=>actors.find(a=>a.id===id);
function storeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function storeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function storeRemove(k){try{localStorage.removeItem(k)}catch(e){}}
const storedImages=JSON.parse(storeGet(IMGKEY)||'{}');
actors.forEach(a=>{if(storedImages[a.name])a.image=storedImages[a.name]});
function importCSV(){
 const f=document.getElementById('csvFile').files[0]; if(!f){alert('CSVを選んでください');return}
 const r=new FileReader(); r.onload=()=>{let lines=r.result.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);if(lines.length<2)return;
  let head=lines[0].split(',').map(x=>x.replace(/^"|"$/g,'')), ni=head.indexOf('name'), ii=head.indexOf('image_url'), ri=head.indexOf('image_rights_status');
  if(ni<0||ii<0){alert('name と image_url 列が必要です');return}
  let map={},count=0,skipped=0;
  for(let k=1;k<lines.length;k++){let cols=lines[k].match(/("(?:[^"]|"")*"|[^,]*)(?:,|$)/g)?.map(x=>x.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"'))||[];
   let name=cols[ni],url=cols[ii],rights=ri>=0?cols[ri]:'';
   if(name&&url&&['LICENSED','PERMITTED','OWNED','CC'].includes((rights||'').toUpperCase())){map[name]=url;count++} else if(url) skipped++;
  }
  storeSet(IMGKEY,JSON.stringify(map));document.getElementById('importStatus').textContent=`${count}件を読み込みました。権利ステータス未確認の画像 ${skipped}件は除外しました。`;setTimeout(()=>location.reload(),600)
 };r.readAsText(f,'UTF-8')
}
function clearImages(){storeRemove(IMGKEY);location.reload()}

let S=JSON.parse(storeGet(KEY)||'null')||fresh();
function fresh(){return {phase:'prelim',order:actors.map(a=>a.id).sort(()=>Math.random()-.5),idx:0,kept:[],sel:[],history:[]}}
function save(){storeSet(KEY,JSON.stringify(S))}
function face(a){return a.image?`<img src="${a.image}" alt="${a.name}" onerror="this.outerHTML='<span>${a.name}</span>'">`:`<span>${a.name}</span>`}
function resetAll(){if(confirm('最初からやり直しますか？')){storeRemove(KEY);S=fresh();render()}}
function render(){save();({prelim,main,final,done}[S.phase]||prelim)()}
function prelim(){
 let ids=S.order.slice(S.idx,S.idx+4); if(!ids.length)return beginMain();
 app.innerHTML=`<div class="card"><div class="stage">PRELIMINARY</div><h2>予選 ${Math.floor(S.idx/4)+1} / 50</h2>
 <p>この中で好きな顔を選んでね。<b>0〜3人</b>まで。</p><progress value="${S.idx}" max="200"></progress>
 <div class="grid prelim">${ids.map(id=>{let a=A(id),on=S.sel.includes(id);return `<div class="candidate ${on?'selected':''}" onclick="toggle(${id})">${on?'<span class="check">✓</span>':''}<div class="portrait">${face(a)}</div><div class="label">${a.name}</div></div>`}).join('')}</div>
 <div class="toolbar"><button class="secondary" onclick="undoPrelim()">↶ ひとつ前</button><button onclick="nextPrelim()">次へ</button></div></div>`}
function toggle(id){let k=S.sel.indexOf(id);if(k>=0)S.sel.splice(k,1);else if(S.sel.length<3)S.sel.push(id);render()}
function nextPrelim(){S.history.push({idx:S.idx,sel:[...S.sel]});S.kept.push(...S.sel);S.sel=[];S.idx+=4;render()}
function undoPrelim(){if(!S.history.length)return;let h=S.history.pop();S.idx=h.idx;S.sel=h.sel;S.kept=S.history.flatMap(x=>x.sel);render()}
function beginMain(){
 let p=[...new Set(S.kept)];
 if(p.length<18)p=p.concat(S.order.filter(id=>!p.includes(id)).slice(0,18-p.length));
 S={phase:'main',round:1,pool:p.sort(()=>Math.random()-.5),groups:[],g:0,scores:{},history:[]};buildGroups();render()
}
function buildGroups(){
 let p=[...S.pool].sort(()=>Math.random()-.5);S.groups=[];
 for(let i=0;i<p.length;i+=4)S.groups.push(p.slice(i,i+4));S.g=0
}
function main(){
 if(S.round>3)return beginFinal();
 if(S.g>=S.groups.length){S.round++;if(S.round>3)return beginFinal();buildGroups();return render()}
 let ids=S.groups[S.g];
 app.innerHTML=`<div class="card"><div class="stage">MAIN ROUND</div><h2>本選 ROUND ${S.round} / 3</h2><p>この中で<b>1位 → 2位</b>の順に選んでね。</p>
 <div class="grid">${ids.map(id=>{let a=A(id);return `<div class="candidate" onclick="mainPick(${id})"><div class="portrait">${face(a)}</div><div class="label">${a.name}</div></div>`}).join('')}</div>
 <p class="muted">${S.g+1} / ${S.groups.length}</p></div>`}
function mainPick(id){
 if(!S.pick1){S.pick1=id;document.querySelectorAll('.candidate').forEach(x=>x.style.opacity=.65);event.currentTarget.style.opacity=1;return}
 if(id===S.pick1)return;
 S.scores[S.pick1]=(S.scores[S.pick1]||0)+3;S.scores[id]=(S.scores[id]||0)+2;
 S.history.push([S.pick1,id]);S.pick1=null;S.g++;render()
}
function beginFinal(){
 let ranked=[...new Set(S.pool)].sort((a,b)=>(S.scores[b]||0)-(S.scores[a]||0));
 if(ranked.length<18)ranked=ranked.concat(S.order.filter(id=>!ranked.includes(id)).slice(0,18-ranked.length));
 S={phase:'final',remaining:ranked.slice(0,18),ranking:[],current:null,lo:0,hi:0,mid:0,history:[]};nextInsert();render()
}
// Interactive binary-insertion ranking: far fewer taps than full 18-person round robin.
function nextInsert(){
 if(!S.remaining.length){S.phase='done';S.top=S.ranking.slice(0,9);return}
 S.current=S.remaining.shift();
 if(!S.ranking.length){S.ranking=[S.current];return nextInsert()}
 S.lo=0;S.hi=S.ranking.length;S.mid=Math.floor((S.lo+S.hi)/2)
}
function final(){
 if(S.phase==='done')return done();
 if(S.lo>=S.hi){S.ranking.splice(S.lo,0,S.current);return nextInsert(),render()}
 S.mid=Math.floor((S.lo+S.hi)/2);let a=A(S.current),b=A(S.ranking[S.mid]);
 app.innerHTML=`<div class="card"><div class="stage">FINAL ROUND</div><h2>決勝｜どっちの顔が好き？</h2><p>直感で1人をタップ。</p><div class="grid">
 <div class="candidate" onclick="finalPick(true)"><div class="portrait">${face(a)}</div><div class="label">${a.name}</div></div>
 <div class="candidate" onclick="finalPick(false)"><div class="portrait">${face(b)}</div><div class="label">${b.name}</div></div></div>
 <p class="muted">18人を二択で並べ替え中。TOP9が決まったら終了。</p></div>`}
function finalPick(currentWins){if(currentWins)S.hi=S.mid;else S.lo=S.mid+1;render()}
function done(){
 let t=S.top.map(A), display=[3,4,5,1,0,2,6,7,8].map(i=>({a:t[i],rank:i+1}));
 app.innerHTML=`<div class="card"><div class="stage">YOUR SUKIGAO 9</div><h2>あなたの 俳優好き顔9選 👑</h2>
 <div class="result">${display.map((x,k)=>`<div class="tile ${x.rank===1?'center':''}"><div class="portrait">${face(x.a)}</div><div class="rank"><b>${x.rank}位</b><br>${x.a.name}</div></div>`).join('')}</div>
 <div class="toolbar"><button onclick="copyResult()">結果テキストをコピー</button><button class="secondary" onclick="resetAll()">もう一度</button></div>
 <p class="muted">配置：4・5・6 / 2・1・3 / 7・8・9（1位が中央）</p></div>`}
function copyResult(){let txt='私の俳優好き顔9選👑\\n'+S.top.map((id,i)=>`${i+1}位 ${A(id).name}`).join('\\n')+'\\n#俳優好き顔9選';navigator.clipboard.writeText(txt).then(()=>alert('コピーしました'))}
function startQuiz(){
  document.getElementById('startBtn').closest('.card').style.display='none';
  app.style.display='block';
  render();
  app.scrollIntoView({behavior:'smooth',block:'start'});
}
</script></body></html>
